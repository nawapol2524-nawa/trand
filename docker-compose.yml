version: "3.8"

# ==============================================================================
# Decoupled Production Services for AI Forex Autonomous Trading System
# Security Standard: Gate 25 (Decoupled Worker, Least Privilege, Zero Silent Promotion)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Trading Engine (Shadow / Paper Broker Execution)
  # ----------------------------------------------------------------------------
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ai_forex_trading_bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - LIVE_TRADING=false
      - AUTO_PROMOTION=false
      - DERIV_APP_ID=${DERIV_APP_ID:-1089}
      - DERIV_API_TOKEN=${DERIV_API_TOKEN:-}
      - LOG_LEVEL=INFO
    volumes:
      # Persistent logs (read-write)
      - ./logs:/app/logs:rw
      # Model registry and champion artifact (read-only for trading security)
      - ./artifacts/models:/app/artifacts/models:ro
      # Clean market data cache (read-only)
      - ./data/clean:/app/data/clean:ro
    command: ["python3", "scripts/run_shadow_engine.py", "--symbol", "frxEURUSD", "--max-ticks", "0"]
    networks:
      - trading_network

  # ----------------------------------------------------------------------------
  # Service 2: Continuous Retraining Worker (Decoupled Retraining & Governance)
  # ----------------------------------------------------------------------------
  training-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ai_forex_training_worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - LIVE_TRADING=false
      - AUTO_PROMOTION=false
      - MIN_NEW_SAMPLES=200
      - LOG_LEVEL=INFO
    volumes:
      # Persistent training telemetry logs (read-write)
      - ./logs:/app/logs:rw
      # Model registry and newly retrained candidate models (read-write)
      - ./artifacts/models:/app/artifacts/models:rw
      # Clean market data cache (read-only)
      - ./data/clean:/app/data/clean:ro
    command: ["python3", "scripts/run_continuous_trainer.py", "--trigger", "INTERVAL", "--min-new-samples", "200"]
    networks:
      - trading_network

networks:
  trading_network:
    driver: bridge
    internal: false
