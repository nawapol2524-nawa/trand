version: '3.9'

services:
  trading-bot:
    build: .
    container_name: deriv-ctrader-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TRADING_MODE=${TRADING_MODE:-DEMO}
      - LIVE_TRADING_ENABLED=${LIVE_TRADING_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "python", "-m", "src.services.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
