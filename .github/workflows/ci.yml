name: Trading Bot CI/CD & Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────
  # GATE 1: Lint & Python Syntax Check
  # Skips gracefully when no Python source exists (rebuild phase)
  # ─────────────────────────────────────────────────────────
  lint-and-syntax:
    name: Lint & Python Syntax Check
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.check_src.outputs.has_python }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect Python source files
        id: check_src
        shell: bash
        run: |
          COUNT=$(find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./.git/*" \
            -not -path "./\.*" \
            | wc -l | tr -d ' ')
          echo "Python files found: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
            echo "No Python source yet — rebuild phase, lint skipped"
          fi

      - name: Install flake8
        if: steps.check_src.outputs.has_python == 'true'
        run: pip install flake8

      - name: Flake8 critical errors only
        if: steps.check_src.outputs.has_python == 'true'
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.venv,__pycache__,.git

      - name: Bytecode compilation check
        if: steps.check_src.outputs.has_python == 'true'
        run: |
          python -m compileall -q -x ".venv|.git" .

      - name: Gate passed (no source)
        if: steps.check_src.outputs.has_python == 'false'
        run: echo "PASS — no Python source files yet (rebuild phase)"

  # ─────────────────────────────────────────────────────────
  # GATE 2: Security & Secret Leakage Scanner
  # Uses only standard tools — no heredoc, no detect-secrets
  # ─────────────────────────────────────────────────────────
  security-hygiene-scan:
    name: Security & Secret Leakage Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HARD CHECK — .env must not be tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked by git"
            exit 1
          fi
          echo "PASS: .env is not tracked"

      - name: HARD CHECK — .env must be in .gitignore
        shell: bash
        run: |
          if git check-ignore .env > /dev/null 2>&1; then
            echo "PASS: .env is covered by .gitignore"
          else
            echo "FAIL: .env is not in .gitignore"
            exit 1
          fi

      - name: HARD CHECK — .env must not be in git history
        shell: bash
        run: |
          HITS=$(git log --all --full-history --oneline -- .env 2>/dev/null | wc -l | tr -d ' ')
          if [ "$HITS" -gt "0" ]; then
            echo "WARNING: .env appears in $HITS commit(s) in history"
            echo "If it contained real credentials, rotate/revoke them immediately"
            echo "Consider git filter-repo to scrub history"
          else
            echo "PASS: .env has never been committed"
          fi

      - name: CHECK — no real API keys in tracked files
        shell: bash
        run: |
          # Only check files currently tracked (not history)
          TRACKED=$(git ls-files | grep -v ".env.example" | grep -v ".gitignore" | grep -v ".dockerignore" || true)
          if [ -z "$TRACKED" ]; then
            echo "PASS: no tracked files to scan (rebuild phase)"
            exit 0
          fi

          # Pattern: assignment of suspicious value (not a placeholder)
          FOUND=0
          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              # Look for patterns like KEY = "Abc123..." where value is long and non-placeholder
              RESULT=$(grep -En "(API_KEY|SECRET|TOKEN|PASSWORD|PRIVATE)\s*=\s*[\"'][^\"']{20,}[\"']" "$FILE" 2>/dev/null \
                | grep -iv "YOUR_\|PLACEHOLDER\|EXAMPLE\|CHANGE_ME\|DUMMY\|TEST_\|FAKE_" || true)
              if [ -n "$RESULT" ]; then
                echo "POTENTIAL SECRET in $FILE:"
                # Print file+line but NEVER the value
                echo "$RESULT" | sed "s/=.*/= [REDACTED]/" | head -5
                FOUND=1
              fi
            fi
          done <<< "$TRACKED"

          if [ "$FOUND" -eq 1 ]; then
            echo "FAIL: potential hardcoded secrets found — review above"
            exit 1
          fi
          echo "PASS: no hardcoded secrets found in tracked files"

      - name: CHECK — .env.example contains only placeholders
        shell: bash
        run: |
          if [ ! -f ".env.example" ]; then
            echo "PASS: no .env.example present"
            exit 0
          fi
          # Values that look real (long random strings, not placeholder words)
          REAL=$(grep -E "=\s*[A-Za-z0-9+/]{30,}" .env.example \
            | grep -iv "YOUR_\|PLACEHOLDER\|EXAMPLE\|CHANGE_ME\|DUMMY" || true)
          if [ -n "$REAL" ]; then
            echo "FAIL: .env.example may contain real secrets"
            echo "$REAL" | sed "s/=.*/= [REDACTED]/"
            exit 1
          fi
          echo "PASS: .env.example contains only placeholders"

  # ─────────────────────────────────────────────────────────
  # GATE 3: Full Test Suite
  # Requires Gates 1 & 2 — skips gracefully in rebuild phase
  # ─────────────────────────────────────────────────────────
  test-suite:
    name: Full Test Suite Execution
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, security-hygiene-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check prerequisites
        id: check_tests
        shell: bash
        run: |
          HAS_REQ=false
          HAS_TESTS=false
          [ -f "requirements.txt" ] && HAS_REQ=true
          find tests/ -name "test_*.py" 2>/dev/null | grep -q . && HAS_TESTS=true
          if [ "$HAS_REQ" = "true" ] && [ "$HAS_TESTS" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Rebuild phase: requirements=$HAS_REQ tests=$HAS_TESTS"
          fi

      - name: Install dependencies
        if: steps.check_tests.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Run pytest
        if: steps.check_tests.outputs.ready == 'true'
        run: PYTHONPATH=. python -m pytest tests/ -q --tb=short

      - name: Gate pending
        if: steps.check_tests.outputs.ready == 'false'
        run: echo "PASS — test gate pending (rebuild phase)"

  # ─────────────────────────────────────────────────────────
  # GATE 4: Static AST OOS Leakage Scan
  # Only runs when audit script exists
  # ─────────────────────────────────────────────────────────
  ast-oos-audit:
    name: Static AST Out-of-Sample Leakage Scan
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if audit script exists
        id: check_audit
        shell: bash
        run: |
          if [ -f "scripts/audit_oos_access.py" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pandas
        if: steps.check_audit.outputs.ready == 'true'
        run: pip install pandas

      - name: Run OOS audit
        if: steps.check_audit.outputs.ready == 'true'
        run: PYTHONPATH=. python3 scripts/audit_oos_access.py

      - name: Gate pending
        if: steps.check_audit.outputs.ready == 'false'
        run: echo "PASS — AST audit pending (rebuild phase)"
