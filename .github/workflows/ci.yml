name: Trading Bot CI/CD & Security Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # GATE 1: Lint & Python Syntax Check
  # Only runs when Python source files exist
  # ─────────────────────────────────────────────
  lint-and-syntax:
    name: Lint & Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check if Python source exists
        id: check_src
        run: |
          if find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*" | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
            echo "Python files found"
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
            echo "No Python files yet — lint skipped (repo rebuild in progress)"
          fi

      - name: Install Linting Tools
        if: steps.check_src.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Flake8 — Syntax & Critical Error Scan
        if: steps.check_src.outputs.has_python == 'true'
        run: |
          # E9: Runtime errors, F63: Invalid syntax in assert/print
          # F7: Syntax errors in general, F82: Undefined names
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.venv,__pycache__,.git,*.egg-info

      - name: Python Bytecode Compilation Verification
        if: steps.check_src.outputs.has_python == 'true'
        run: |
          # Compile all Python files to verify no syntax errors
          python3 -m compileall -q $(find . -name "*.py" -not -path "./.venv/*" -not -path "./.git/*" | xargs dirname | sort -u | tr '\n' ' ') || true
          python3 -m compileall -q . -x ".venv|.git" 2>&1 | grep -E "^(Compiling|error|Error)" || true

      - name: Lint skipped notice
        if: steps.check_src.outputs.has_python == 'false'
        run: echo "✅ Lint gate passed (no Python source files — rebuild phase)"

  # ─────────────────────────────────────────────
  # GATE 2: Security & Secret Leakage Scanner
  # Scans git history for secrets, never prints them
  # ─────────────────────────────────────────────
  security-hygiene-scan:
    name: Security & Secret Leakage Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scan

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scanner Dependencies
        run: |
          pip install pyyaml detect-secrets==1.5.0

      - name: Verify .env is NOT tracked
        run: |
          echo "=== Checking .env tracking ==="
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ CRITICAL: .env is tracked by git!"
            exit 1
          else
            echo "✅ .env is NOT tracked by git"
          fi

      - name: Verify .env is in .gitignore
        run: |
          echo "=== Checking .gitignore ==="
          if git check-ignore .env > /dev/null 2>&1; then
            echo "✅ .env is covered by .gitignore"
          else
            echo "❌ .env is NOT in .gitignore"
            exit 1
          fi

      - name: Scan for hardcoded secrets in source (detect-secrets)
        run: |
          echo "=== Secret scan on current working tree ==="
          # Exclude known safe files and test fixtures
          detect-secrets scan \
            --exclude-files '\.env\.example$' \
            --exclude-files '\.git/.*' \
            --exclude-files '.*\.zip$' \
            --exclude-files '.*\.joblib$' \
            --exclude-files '.*\.parquet$' \
            . > .secrets_baseline_ci.json 2>&1 || true

          # Count detected secrets (excluding whitelisted)
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open(".secrets_baseline_ci.json") as f:
                  data = json.load(f)
          except Exception:
              print("✅ No secrets baseline (no Python source yet)")
              sys.exit(0)

          results = data.get("results", {})
          total = sum(len(v) for v in results.values())
          if total > 0:
              print(f"⚠️  detect-secrets found {total} potential secret(s):")
              for filepath, secrets in results.items():
                  for s in secrets:
                      # Never print the actual value
                      print(f"  - {filepath}:{s.get('line_number','?')} type={s.get('type','?')}")
              print("ACTION REQUIRED: Review and either fix or whitelist each finding")
              sys.exit(1)
          else:
              print("✅ No secrets detected in working tree")
          PYEOF

      - name: Check git history for previously committed .env or secrets
        run: |
          echo "=== Checking git history for .env files ==="
          if git log --all --full-history -- ".env" | grep -q "commit"; then
            echo "⚠️  WARNING: .env appears in git history"
            echo "   If it contained real credentials, please rotate/revoke those credentials"
            echo "   Consider using 'git filter-repo' to scrub history if needed"
            # This is a warning, not a hard failure (history cannot be changed without force-push)
          else
            echo "✅ .env has never been committed to git history"
          fi

      - name: Verify no obvious API keys in tracked files
        run: |
          echo "=== Scanning tracked files for obvious key patterns ==="
          # Search for common secret patterns in currently tracked files
          SECRET_FOUND=0

          # Pattern: long hex strings that look like API keys (40+ chars)
          if git ls-files | xargs grep -l "[A-Za-z0-9]{40,}" 2>/dev/null | grep -v ".gitignore" | grep -v ".env.example" | grep -q .; then
            echo "⚠️  Potential secret patterns found in tracked files (review manually)"
          else
            echo "✅ No obvious API key patterns in tracked files"
          fi

          # Pattern: explicit secret assignments
          PATTERNS='(API_KEY|api_key|SECRET|secret|PASSWORD|password|TOKEN|token)\s*=\s*[\"'"'"'][A-Za-z0-9+/=_\-]{16,}'
          MATCHES=$(git ls-files | xargs grep -rEn "$PATTERNS" 2>/dev/null | grep -v ".env.example" | grep -v "# " | grep -v "YOUR_" | grep -v "PLACEHOLDER" | grep -v "test_" || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ Potential hardcoded secrets found:"
            # Print file:line but NOT the secret value
            echo "$MATCHES" | sed 's/=.*/= [REDACTED]/' | head -20
            SECRET_FOUND=1
          else
            echo "✅ No hardcoded secret assignments found in tracked files"
          fi

          if [ "$SECRET_FOUND" -eq 1 ]; then
            exit 1
          fi

  # ─────────────────────────────────────────────
  # GATE 3: Full Test Suite
  # Requires Gates 1 & 2 to pass
  # Only runs when test files exist
  # ─────────────────────────────────────────────
  test-suite:
    name: Full Test Suite Execution
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, security-hygiene-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check if tests and requirements exist
        id: check_tests
        run: |
          if [ -f "requirements.txt" ] && find tests/ -name "test_*.py" 2>/dev/null | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "No tests or requirements.txt yet — skipping test execution (rebuild phase)"
          fi

      - name: Install Dependencies
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (pytest)
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          PYTHONPATH=. python -m pytest tests/ -q --tb=short -v

      - name: Tests skipped notice
        if: steps.check_tests.outputs.has_tests == 'false'
        run: echo "✅ Test gate pending (no test files yet — rebuild phase)"

  # ─────────────────────────────────────────────
  # GATE 4: Static AST Out-of-Sample Leakage Scan
  # Only runs when audit script exists
  # ─────────────────────────────────────────────
  ast-oos-audit:
    name: Static AST Out-of-Sample Leakage Scan
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check if audit script exists
        id: check_audit
        run: |
          if [ -f "scripts/audit_oos_access.py" ]; then
            echo "has_audit=true" >> $GITHUB_OUTPUT
          else
            echo "has_audit=false" >> $GITHUB_OUTPUT
            echo "Audit script not yet created — skipping (rebuild phase)"
          fi

      - name: Install Pandas
        if: steps.check_audit.outputs.has_audit == 'true'
        run: pip install pandas

      - name: Execute AST OOS Scanner
        if: steps.check_audit.outputs.has_audit == 'true'
        run: |
          PYTHONPATH=. python3 scripts/audit_oos_access.py

      - name: Audit skipped notice
        if: steps.check_audit.outputs.has_audit == 'false'
        run: echo "✅ AST audit pending (script not yet created — rebuild phase)"
